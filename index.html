<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Calorie Tracker</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="https://fav.farm/🥗">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --accent-muted: #064e3b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1.25rem; max-width: 600px; margin: 0 auto; min-height: 100vh; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--text); }
    .badge { background: #334155; color: #38bdf8; font-size: 0.75rem; padding: 2px 8px; border-radius: 9999px; }
    #syncStatus { font-size: 0.75rem; color: var(--text-muted); }

    .user-bar {
      display: flex; gap: 8px; align-items: center; margin-bottom: 1.25rem;
      background: var(--card-bg); padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border);
    }
    .user-bar select {
      flex: 1; background: #0f172a; border: 1px solid var(--border); color: var(--text);
      padding: 0.4rem 0.6rem; border-radius: 6px; outline: none; font-size: 0.9rem;
    }
    .user-bar button {
      background: #334155; border: 1px solid var(--border); color: var(--text);
      padding: 0.4rem 0.7rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }

    .date-selector { margin-bottom: 1.25rem; }
    .date-selector input[type="date"] {
      width: 100%; background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
      padding: 0.6rem 1rem; border-radius: 8px; font-size: 1rem; outline: none;
    }

    .dashboard-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .calorie-summary { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.75rem; }
    .calorie-digits { font-size: 2rem; font-weight: 800; color: var(--accent); }
    .target-digits { font-size: 0.95rem; color: var(--text-muted); }

    .progress-container { width: 100%; height: 12px; background: #334155; border-radius: 6px; position: relative; margin-bottom: 1rem; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.4s ease; }
    .bmr-marker { position: absolute; top: 0; bottom: 0; width: 3px; background: #f59e0b; z-index: 2; }

    .macro-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
    .macro-item { background: rgba(255, 255, 255, 0.03); padding: 8px; border-radius: 8px; }
    .macro-label { font-size: 0.75rem; color: var(--text-muted); }
    .macro-val { font-size: 1rem; font-weight: 600; margin-top: 2px; }

    .input-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .input-box { display: flex; gap: 8px; }
    .input-box input {
      flex: 1; background: #0f172a; border: 1px solid var(--border); color: var(--text);
      padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.95rem; outline: none;
    }
    .input-box button {
      background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
      width: 44px; height: 44px; border-radius: 8px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-size: 1.2rem;
    }
    .btn-submit { background: var(--accent) !important; color: #0f172a !important; font-weight: bold; border: none !important; }
    .recording { background: var(--danger) !important; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }
    #inputStatus { font-size: 0.8rem; margin-top: 8px; min-height: 1.2rem; }

    .meals-container { display: flex; flex-direction: column; gap: 8px; }
    .meal-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem; display: flex; justify-content: space-between; align-items: center;
    }
    .meal-type { font-size: 0.75rem; color: var(--accent); font-weight: 600; text-transform: uppercase; margin-bottom: 2px; display: block; }
    .meal-name { font-size: 0.95rem; font-weight: 500; }
    .meal-macros { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; display: block; }
    .meal-calories { font-size: 1rem; font-weight: 700; }
    .delete-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; }
    .delete-btn:hover { color: var(--danger); }

    /* Modal Impostazioni Utente */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; width: 90%; max-width: 440px; padding: 1.5rem; }
    .modal-content h2 { font-size: 1.1rem; margin-bottom: 1rem; }
    .form-group { margin-bottom: 0.8rem; display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.8rem; color: var(--text-muted); }
    .form-group input, .form-group select {
      background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 0.5rem; border-radius: 6px; outline: none; font-size: 0.9rem;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.2rem; }
    .modal-actions button { padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; border: none; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Calorie Tracker</h1>
      <span class="badge">v1.6.0</span>
    </div>
    <span id="syncStatus">Cloud attivo</span>
  </header>

  <div class="user-bar">
    <span style="font-size: 0.85rem; color: var(--text-muted);">Utente:</span>
    <select id="userSelect"></select>
    <button id="editUserBtn" title="Modifica profilo">⚙️ Profilo</button>
    <button id="addUserBtn" title="Aggiungi utente">➕</button>
  </div>

  <div class="date-selector">
    <input type="date" id="datePicker">
  </div>

  <section class="dashboard-card">
    <div class="calorie-summary">
      <div>
        <span class="calorie-digits" id="totalCalories">0</span>
        <span class="target-digits">/ <span id="targetTdee">0</span> kcal TDEE</span>
      </div>
      <span class="target-digits">BMR: <span id="userBmrVal">0</span> kcal</span>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="calorieProgressBar"></div>
      <div class="bmr-marker" id="bmrMarker" title="Soglia BMR"></div>
    </div>

    <div class="macro-grid">
      <div class="macro-item">
        <div class="macro-label">Proteine</div>
        <div class="macro-val" id="totalProtein" style="color: #60a5fa;">0g</div>
      </div>
      <div class="macro-item">
        <div class="macro-label">Carboidrati</div>
        <div class="macro-val" id="totalCarbs" style="color: #facc15;">0g</div>
      </div>
      <div class="macro-item">
        <div class="macro-label">Grassi</div>
        <div class="macro-val" id="totalFat" style="color: #f87171;">0g</div>
      </div>
    </div>
  </section>

  <section class="input-section">
    <div class="input-box">
      <input type="text" id="mealTextInput" placeholder="Es. 80g pasta con tonno...">
      <button id="voiceBtn" title="Dettatura vocale">🎙️</button>
      <button id="submitTextBtn" class="btn-submit" title="Invia">➔</button>
    </div>
    <div id="inputStatus"></div>
  </section>

  <div class="meals-container" id="mealsList"></div>

  <!-- Modal Impostazioni Utente -->
  <div id="userModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Profilo Utente</h2>
      <div class="form-group" id="userNameGroup">
        <label>Nome Utente</label>
        <input type="text" id="profName" placeholder="Nome">
      </div>
      <div class="form-group">
        <label>Genere</label>
        <select id="profGender">
          <option value="male">Uomo</option>
          <option value="female">Donna</option>
        </select>
      </div>
      <div class="form-group">
        <label>Età (anni)</label>
        <input type="number" id="profAge" value="20">
      </div>
      <div class="form-group">
        <label>Altezza (cm)</label>
        <input type="number" id="profHeight" value="173">
      </div>
      <div class="form-group">
        <label>Peso (kg)</label>
        <input type="number" id="profWeight" value="71" step="0.1">
      </div>
      <div class="form-group">
        <label>Stile di Vita e Attività Fisica</label>
        <select id="profActivityLevel">
          <option value="sedentary">Sedentario (Studio/Ufficio, nessun allenamento)</option>
          <option value="light">Leggero (Camminate o 1-3 allenamenti a settimana)</option>
          <option value="moderate">Moderato (Lavoro in movimento o 3-5 allenamenti)</option>
          <option value="active">Molto attivo (Lavoro fisico o 6-7 allenamenti intensi)</option>
        </select>
      </div>
      <div class="modal-actions">
        <button id="cancelModalBtn" style="background:#334155; color:var(--text);">Annulla</button>
        <button id="saveProfileBtn" style="background:var(--accent); color:#0f172a; font-weight:bold;">Salva</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
